# Tests against the hosted STAGING deployment (classi-staging on Vercel + the classi-staging Supabase project),
# through the app and Supabase Auth only: NO database connection and NO service keys (tests/staging).
# Runs when the branch "staging-test" is pushed, or by hand. Needs, in the GitHub Environment "staging"
# (deployment branch limited to staging-test; never in code or chat):
#   variable STAGING_URL                       https://classi-staging.vercel.app
#   secret   VERCEL_AUTOMATION_BYPASS_SECRET   classi-staging -> Settings -> Deployment Protection -> Protection Bypass
#   secrets  STAGING_OTP_TEACHER / _INSTITUTE / _PARENT / _STUDENT / _ADMIN
#            the fixed codes of the five Supabase test numbers 972500000001..05 (Authentication -> Phone)
# The Environment must NOT contain a database connection (STAGING_DB_URL lives in the separate "staging-db").
name: Staging

on:
  push:
    branches: [staging-test]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    env:
      BASE_URL: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the target is staging and no database credential is in reach
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # referenced only to prove they are absent from this Environment
          LEFTOVER_DB_URL: ${{ secrets.STAGING_DB_URL }}
          LEFTOVER_E2E_DB_URL: ${{ secrets.STAGING_E2E_DB_URL }}
        run: |
          [ "${BASE_URL%/}" = "https://classi-staging.vercel.app" ] || { echo "::error::STAGING_URL must be exactly https://classi-staging.vercel.app"; exit 1; }
          [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ] || { echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not set in Environment staging"; exit 1; }
          # A secret is visible here if it is in Environment "staging" OR a REPOSITORY secret (repository secrets reach
          # every workflow on every branch). Database links belong only in Environment "staging-db".
          [ -z "$LEFTOVER_DB_URL" ] || { echo "::error::STAGING_DB_URL is visible to this job: it is a repository secret or in Environment staging. Keep it only in Environment staging-db (Settings -> Environments -> staging-db), then delete the repository secret"; exit 1; }
          [ -z "$LEFTOVER_E2E_DB_URL" ] || { echo "::error::STAGING_E2E_DB_URL is visible to this job: delete it (repository secrets and Environment staging); the staging suite has no database access"; exit 1; }
          echo "target: $BASE_URL"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: npm ci + browser + Lighthouse
        id: deps
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm install --no-save --no-audit --no-fund lighthouse@12.6.1 axe-core@4.10.2   # Lighthouse and the S7 accessibility check, not part of the app
          # everything the next steps need, checked before any test starts
          node -e "require.resolve('@playwright/test'); require('fs').accessSync(require('@playwright/test').chromium.executablePath())"
          npx --no-install lighthouse --version
          node -e "require.resolve('axe-core/axe.min.js')"
      - name: Staging journeys (phone + desktop), UI only
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          STAGING_OTP_TEACHER: ${{ secrets.STAGING_OTP_TEACHER }}
          STAGING_OTP_INSTITUTE: ${{ secrets.STAGING_OTP_INSTITUTE }}
          STAGING_OTP_PARENT: ${{ secrets.STAGING_OTP_PARENT }}
          STAGING_OTP_STUDENT: ${{ secrets.STAGING_OTP_STUDENT }}
          STAGING_OTP_ADMIN: ${{ secrets.STAGING_OTP_ADMIN }}
        run: npx playwright test -c tests/staging/playwright.config.mjs 2>&1 | tee /tmp/e2e.log
      - name: Lighthouse against staging
        # also after failed journeys (useful numbers), but never when the safety check or the install did not pass
        if: always() && steps.deps.outcome == 'success'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          CHROME="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          BASE="${BASE_URL%/}"
          # The bypass secret goes only to the staging host (headers, not the URL), through the same code as the
          # journeys (tests/staging/bypass.mjs); Lighthouse gets the resulting cookie instead of the secret.
          CF="$RUNNER_TEMP/classi-staging-cookie"
          node tests/staging/bypass.mjs --cookie-file "$CF"
          COOKIE="$(cat "$CF")"; rm -f "$CF"
          echo "::add-mask::$COOKIE"
          # an offer id from the public search page (no database access)
          OFFER="$(curl -s -H "Cookie: $COOKIE" "$BASE/search" | grep -o '/offer/[0-9a-f-]\{36\}' | head -1)"
          echo "page | form factor | performance | accessibility | best practices | SEO | LCP ms"
          for p in "/" "/search" "$OFFER"; do [ -n "$p" ] || continue; for ff in mobile desktop; do
            [ "$ff" = desktop ] && preset="--preset=desktop" || preset=""
            CHROME_PATH="$CHROME" npx --no-install lighthouse "$BASE$p" $preset --quiet --chrome-flags="--headless=new --no-sandbox" \
              --extra-headers="$(node -e 'console.log(JSON.stringify({Cookie: process.argv[1]}))' "$COOKIE")" \
              --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=/tmp/lh.json >/dev/null 2>&1 || { echo "$p | $ff | failed"; continue; }
            node -e 'const r=require("/tmp/lh.json"),c=r.categories,a=r.audits,s=k=>Math.round((c[k]?.score??0)*100);console.log([process.argv[1],process.argv[2],s("performance"),s("accessibility"),s("best-practices"),s("seo"),Math.round(a["largest-contentful-paint"].numericValue)].join(" | "))' "$p" "$ff"
          done; done 2>&1 | tee /tmp/lighthouse.log
          rm -f /tmp/lh.json
      - name: Report (annotations)
        if: always()
        run: |
          sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e.log | grep -aE '^ +[0-9]+ (passed|failed|flaky|skipped|did not run)|✘|^ +\[(mobile|desktop)\] ›' > /tmp/e2e-summary.log || true
          sh .github/report.sh "staging" /tmp/e2e-summary.log /tmp/e2e.log /tmp/lighthouse.log
          rm -f "$RUNNER_TEMP"/classi-staging-bypass.json

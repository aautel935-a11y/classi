# Classi CI. No production secrets are used anywhere: the database jobs run on a throw-away Postgres or on a local
# Supabase stack inside the runner, with synthetic data only.
name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failing command fails the step even when piped into tee

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders so the build can run; they point at a local stack, never at production.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lockfile:
    # One-time bootstrap: the repository has no package-lock.json yet. On a push to a branch of this repository,
    # create it with `npm install` and commit it back, so every later run can use `npm ci`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      created: ${{ steps.lock.outputs.created }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: lock
        run: |
          if [ -f package-lock.json ]; then echo "created=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          npm install --no-audit --no-fund
          git config user.name "classi-ci"; git config user.email "ci@users.noreply.github.com"
          git add package-lock.json
          git commit -m "CI: add package-lock.json (generated by npm install)"
          git push
          echo "created=true" >> "$GITHUB_OUTPUT"

  quality:
    needs: lockfile
    if: always() && needs.lockfile.outputs.created != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: npm ci
        run: npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm.log
      - name: Dependency audit (high and above)
        if: always()
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/audit.log
      - name: TypeScript
        if: always()
        run: npx tsc --noEmit 2>&1 | tee /tmp/tsc.log
      - name: ESLint
        if: always()
        run: npx next lint 2>&1 | tee /tmp/lint.log
      - name: Unit tests
        if: always()
        run: sh tests/run-unit.sh 2>&1 | tee /tmp/unit.log
      - name: next build
        if: always()
        run: npx next build 2>&1 | tee /tmp/build.log
      - name: Report (annotations)
        if: always()
        run: sh .github/report.sh "quality" /tmp/npm.log /tmp/audit.log /tmp/tsc.log /tmp/lint.log /tmp/unit.log /tmp/build.log

  database:
    needs: lockfile
    if: always() && needs.lockfile.outputs.created != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGSOCK: 127.0.0.1
      PGPORT: "5432"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: SQL suites
        run: sh supabase/tests/run_all.sh 2>&1 | tee /tmp/sql.log
      - name: No UPDATE/DELETE without WHERE (Supabase pg_safeupdate)
        if: always()
        run: node tests/check-safeupdate.mjs 2>&1 | tee /tmp/safeupdate.log
      - name: Concurrency
        if: always()
        run: sh supabase/tests/concurrency_test.sh 2>&1 | tee /tmp/conc.log
      - name: RPC grants match the app
        if: always()
        run: sh supabase/tests/check_rpc_grants.sh 2>&1 | tee /tmp/grants.log
      - name: Rollback drill (phase 2 down file)
        if: always()
        run: sh supabase/tests/rollback_drill.sh supabase/rollback/20261031010000_functional_fixes.down.sql flow_test roles_test security_test 2>&1 | tee /tmp/drill.log
      - name: Report (annotations)
        if: always()
        run: sh .github/report.sh "database" /tmp/safeupdate.log /tmp/sql.log /tmp/conc.log /tmp/grants.log /tmp/drill.log

  e2e:
    # Full browser tests against a local Supabase stack (Docker) and a production build of the app.
    needs: lockfile
    if: always() && needs.lockfile.outputs.created != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Start local Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime 2>&1 | sed -E 's/(sb_(publishable|secret)_)[A-Za-z0-9_-]+/\1[redacted]/g; s/[0-9a-f]{64}/[redacted]/g; s/eyJ[A-Za-z0-9._-]+/[redacted]/g' > /tmp/supabase.log; tail -3 /tmp/supabase.log
      - name: Local keys
        run: |
          supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "E2E_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: npm ci + browsers
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Build and start the app
        run: |
          npx next build 2>&1 | tee /tmp/e2e-build.log
          (npx next start -p 3000 > /tmp/next.log 2>&1 &)
          npx --yes wait-on@8 -t 60000 http://localhost:3000/
      - name: Playwright
        env: { BASE_URL: "http://localhost:3000" }
        run: npx playwright test -c tests/e2e/playwright.config.mjs --reporter=list 2>&1 | tee /tmp/e2e.log
      - name: Report (annotations)
        if: always()
        run: |
          docker logs supabase_auth_classi-local 2>&1 | grep -E '"level":"(warning|error)"' | grep -v DEPRECATION | tail -25 > /tmp/auth.log || true
          docker logs supabase_db_classi-local 2>&1 | grep -E 'ERROR|FATAL' -A1 | tail -30 > /tmp/db.log || true
          grep -a '\[page\]' /tmp/e2e.log > /tmp/e2e-pages.log || true
          sh .github/report.sh "e2e" /tmp/supabase.log /tmp/e2e-build.log /tmp/e2e.log /tmp/e2e-pages.log /tmp/next.log /tmp/auth.log /tmp/db.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: "tests/e2e/report\ntests/e2e/results", retention-days: 7 }


# Classi CI. No production secrets are used anywhere: the database jobs run on a throw-away Postgres or on a local
# Supabase stack inside the runner, with synthetic data only.
name: CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failing command fails the step even when piped into tee

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders so the build can run; they point at a local stack, never at production.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: npm ci
        run: npm ci --no-audit --no-fund 2>&1 | tee /tmp/npm.log
      - name: Dependency audit (high and above)
        if: always()
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/audit.log
      - name: TypeScript
        if: always()
        run: npx tsc --noEmit 2>&1 | tee /tmp/tsc.log
      - name: ESLint
        if: always()
        run: npx next lint 2>&1 | tee /tmp/lint.log
      - name: Unit tests
        if: always()
        run: sh tests/run-unit.sh 2>&1 | tee /tmp/unit.log
      - name: Database embeds name their foreign key where two links exist
        if: always()
        run: node tests/check-embeds.mjs 2>&1 | tee /tmp/embeds.log
      - name: next build
        if: always()
        run: npx next build 2>&1 | tee /tmp/build.log
      - name: Report (annotations)
        if: always()
        run: sh .github/report.sh "quality" /tmp/npm.log /tmp/audit.log /tmp/tsc.log /tmp/lint.log /tmp/unit.log /tmp/embeds.log /tmp/build.log

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGSOCK: 127.0.0.1
      PGPORT: "5432"
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: SQL suites
        run: sh supabase/tests/run_all.sh 2>&1 | tee /tmp/sql.log
      - name: No UPDATE/DELETE without WHERE (Supabase pg_safeupdate)
        if: always()
        run: node tests/check-safeupdate.mjs 2>&1 | tee /tmp/safeupdate.log
      - name: Concurrency
        if: always()
        run: sh supabase/tests/concurrency_test.sh 2>&1 | tee /tmp/conc.log
      - name: RPC grants match the app
        if: always()
        run: sh supabase/tests/check_rpc_grants.sh 2>&1 | tee /tmp/grants.log
      - name: Staging migrations script (local copy of a staging-like database; never the real one)
        if: always()
        run: sh supabase/tests/staging_migrate_test.sh 2>&1 | tee /tmp/stgmig.log
      - name: Rollback drill (phase 2 down file)
        if: always()
        run: sh supabase/tests/rollback_drill.sh supabase/rollback/20261031010000_functional_fixes.down.sql flow_test roles_test security_test 2>&1 | tee /tmp/drill.log
      - name: Rollback drill (phase 5 down file)
        if: always()
        run: sh supabase/tests/rollback_drill.sh supabase/rollback/20261101010000_phase5_sec33.down.sql trial_packages_test security_test flow_test 2>&1 | tee /tmp/drill5.log
      - name: Rollback drill (phase 4 down file)
        if: always()
        run: sh supabase/tests/rollback_drill.sh supabase/rollback/20261101000000_phase4_performance.down.sql flow_test roles_test security_test functional_test phase3_test messages_test 2>&1 | tee /tmp/drill4.log
      - name: Rollback drill (phases 4 then 3)
        if: always()
        run: sh supabase/tests/rollback_drill.sh supabase/rollback/20261101000000_phase4_performance.down.sql,supabase/rollback/20261031020000_phase3_performance_settings.down.sql flow_test roles_test security_test functional_test 2>&1 | tee /tmp/drill3.log
      - name: Rollback drill (phase 6 photo owner guard)
        if: always()
        run: sh supabase/tests/rollback_drill.sh supabase/rollback/20261103000000_photo_owner_guard.down.sql rollback_photo_owner_checks flow_test roles_test security_test review_test 2>&1 | tee /tmp/drill6a.log
      - name: Rollback drill (phase 6 review columns owner-only)
        if: always()
        run: sh supabase/tests/rollback_drill.sh supabase/rollback/20261103010000_review_columns_owner_only.down.sql rollback_review_columns_checks flow_test roles_test security_test review_test photos_test 2>&1 | tee /tmp/drill6b.log
      - name: Rollback drill (both phase 6 migrations, newest first)
        if: always()
        run: sh supabase/tests/rollback_drill.sh supabase/rollback/20261103010000_review_columns_owner_only.down.sql,supabase/rollback/20261103000000_photo_owner_guard.down.sql rollback_review_columns_checks rollback_photo_owner_checks flow_test security_test 2>&1 | tee /tmp/drill6.log
      - name: Rollback drill (photos bucket listing owner-only)
        if: always()
        run: sh supabase/tests/rollback_drill.sh supabase/rollback/20261104000000_avatars_read_own.down.sql rollback_avatars_read_checks photos_test flow_test security_test review_test 2>&1 | tee /tmp/drill7.log
      - name: The suite catches the open listing (must fail on the old policy)
        if: always()
        run: |
          # the same suite, after the rollback, must report the enumeration (FAIL lines); otherwise it proves nothing
          sh supabase/tests/rollback_drill.sh supabase/rollback/20261104000000_avatars_read_own.down.sql avatars_read_test > /tmp/drill7b.log 2>&1 && { echo "::error::avatars_read_test passed on the old policy"; exit 1; }
          n=$(grep -c "FAIL:" /tmp/drill_avatars_read_test.out); echo "FAIL lines on the old policy: $n"; [ "$n" -ge 8 ]
      - name: Staging apply file refuses any database but classi-staging
        if: always()
        run: |
          P="psql -h ${PGSOCK:-/var/tmp/pgc} -p ${PGPORT:-54329} -U postgres -q"
          $P -c "drop database if exists ct_apply" -c "create database ct_apply" >/dev/null
          out=$($P -d ct_apply -v ON_ERROR_STOP=1 -f supabase/staging/apply_20261104000000_avatars_read_own.sql 2>&1 || true)
          echo "$out" | grep -q "refusing: not the classi-staging database" || { echo "::error::apply file did not refuse: $out"; exit 1; }
          awk '/^-- ===== BEGIN MIGRATION/{f=1;next}/^-- ===== END MIGRATION/{f=0}f' supabase/staging/apply_20261104000000_avatars_read_own.sql | cmp - supabase/migrations/20261104000000_avatars_read_own.sql
          echo "refused outside staging; embedded migration identical to the committed file"
      - name: Search equivalence at growth size (3,000 offers, 409 filter combinations)
        if: always()
        run: |
          DB=ct_perf sh supabase/tests/run.sh perf_data > /tmp/perfdata.log 2>&1
          DB=ct_perf node --experimental-strip-types --no-warnings tests/search-equivalence.mjs 2>&1 | tee /tmp/searcheq.log
      - name: Report (annotations)
        if: always()
        run: sh .github/report.sh "database" /tmp/stgmig.log /tmp/safeupdate.log /tmp/sql.log /tmp/conc.log /tmp/grants.log /tmp/drill.log /tmp/drill5.log /tmp/drill4.log /tmp/drill3.log /tmp/searcheq.log

  e2e:
    # Full browser tests against a local Supabase stack (Docker) and a production build of the app.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb   # v1.7.3
        with: { version: 2.120.0 }   # the same CLI as the staging database workflow
      - name: Start local Supabase (migrations + seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime 2>&1 | sed -E 's/(sb_(publishable|secret)_)[A-Za-z0-9_-]+/\1[redacted]/g; s/[0-9a-f]{64}/[redacted]/g; s/eyJ[A-Za-z0-9._-]+/[redacted]/g' > /tmp/supabase.log; tail -3 /tmp/supabase.log
      - name: Local keys
        run: |
          supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "E2E_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: npm ci + browsers
        run: |
          npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
          npm install --no-save --no-audit --no-fund axe-core@4.10.2   # accessibility checks only, not part of the app
      - name: Build and start the app
        run: |
          npx next build 2>&1 | tee /tmp/e2e-build.log
          (npx next start -p 3000 > /tmp/next.log 2>&1 &)
          npx --yes wait-on@8 -t 60000 http://localhost:3000/
      - name: Staging suite dry run (local stack, the five staging accounts, no database access from the tests)
        run: |
          # same accounts and data as classi-staging (supabase/staging/staging_data.sql), fixed codes from config.toml
          psql "$E2E_DB_URL" -v ON_ERROR_STOP=1 -q -c "insert into public.app_secrets (key, value) values ('deploy_env', 'staging') on conflict (key) do update set value = excluded.value"
          psql "$E2E_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/staging/staging_data.sql > /tmp/staging-dry-data.log 2>&1
          # what the suite may touch, before it runs (it must be exactly the same afterwards)
          psql "$E2E_DB_URL" -v ON_ERROR_STOP=1 -Atq -f supabase/tests/staging_state.sql > /tmp/staging-state-before.txt
          # the suite must work with no database connection in reach: E2E_DB_URL is removed from its environment
          rc=0
          env -u E2E_DB_URL STAGING_DRY_RUN=1 BASE_URL=http://localhost:3000 \
            STAGING_OTP_TEACHER=111111 STAGING_OTP_INSTITUTE=222222 STAGING_OTP_PARENT=333333 STAGING_OTP_STUDENT=444444 STAGING_OTP_ADMIN=555555 \
            npx playwright test -c tests/staging/playwright.config.mjs 2>&1 | tee /tmp/staging-dry.log || rc=$?
          # the state check runs even when a test failed: a failed test must still have put everything back
          psql "$E2E_DB_URL" -v ON_ERROR_STOP=1 -Atq -f supabase/tests/staging_state.sql > /tmp/staging-state-after.txt
          echo "state the suite may touch ($(wc -l < /tmp/staging-state-before.txt) lines):"; cat /tmp/staging-state-before.txt
          if diff /tmp/staging-state-before.txt /tmp/staging-state-after.txt; then echo "PASS: the staging suite left this state exactly as it found it"
          else echo "::error::the staging suite did not put everything back (diff above)"; exit 1; fi
          [ "$rc" = 0 ] || { echo "::error::staging suite dry run failed (state check above)"; exit "$rc"; }
      - name: Staging migrations script on the local stack (test mode; nothing new must change nothing)
        run: STAGING_DB_URL="$E2E_DB_URL" MIGRATE_TEST=1 sh scripts/staging/migrate.sh 2>&1 | tee /tmp/stgmig-e2e.log
      - name: Playwright
        env: { BASE_URL: "http://localhost:3000" }
        run: npx playwright test -c tests/e2e/playwright.config.mjs --reporter=list 2>&1 | tee /tmp/e2e.log
      - name: Lighthouse (public pages, phone and desktop)
        if: always()
        run: sh tests/lighthouse.sh http://localhost:3000 2>&1 | tee /tmp/lighthouse.log
      - name: Backup and restore drill (local Supabase, synthetic accounts from the tests)
        if: always()
        run: |
          {
            mkdir -p /tmp/backups
            DB_URL="$E2E_DB_URL" sh scripts/db/backup.sh /tmp/backups
            B=$(ls -d /tmp/backups/classi-backup-* | tail -1)
            supabase db reset --no-seed >/dev/null 2>&1       # a fresh database with every migration, no data
            DATA_ONLY=1 TARGET_URL="$E2E_DB_URL" sh scripts/db/restore-check.sh "$B"
            psql "$E2E_DB_URL" -q -v ON_ERROR_STOP=1 -c 'set client_min_messages = warning' -f scripts/db/storage-setup.sql
            jobs=$(psql "$E2E_DB_URL" -At -v ON_ERROR_STOP=1 -f scripts/db/cron-jobs.sql | grep -c '^classi-')
            echo "scheduled jobs after the restore: $jobs"; [ "$jobs" = 7 ]
          } 2>&1 | tee /tmp/restore.log
      - name: Report (annotations)
        if: always()
        run: |
          docker logs supabase_auth_classi-local 2>&1 | grep -E '"level":"(warning|error)"' | grep -v DEPRECATION | tail -25 > /tmp/auth.log || true
          docker logs supabase_db_classi-local 2>&1 | grep -E 'ERROR|FATAL' -A1 | tail -30 > /tmp/db.log || true
          grep -a '\[page\]' /tmp/e2e.log > /tmp/e2e-pages.log || true
          grep -a '\[axe\]' /tmp/e2e.log | sort -u > /tmp/axe.log || true
          sed 's/\x1b\[[0-9;]*m//g' /tmp/e2e.log | grep -aE '^ +[0-9]+ (passed|failed|flaky|skipped|did not run)|✘|^ +\[(mobile|desktop)\] ›' > /tmp/e2e-summary.log || true
          sh .github/report.sh "e2e" /tmp/stgmig-e2e.log /tmp/staging-dry.log /tmp/staging-dry-data.log /tmp/supabase.log /tmp/e2e-build.log /tmp/e2e-summary.log /tmp/e2e.log /tmp/axe.log /tmp/lighthouse.log /tmp/restore.log /tmp/e2e-pages.log /tmp/next.log /tmp/auth.log /tmp/db.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: "tests/e2e/report\ntests/e2e/results", retention-days: 7 }


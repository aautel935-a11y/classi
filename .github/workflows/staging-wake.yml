# D-08: ONE test wake-up of the push dispatch route on classi-staging, by hand only, with owner approval (Environment
# "staging"). classi-staging's database cannot wake the app itself (its dispatch_url is unreachable on purpose, so nothing
# real is ever sent), so step B's guard (d08_worker_seen_at) needs this one call to prove the deployed code uses the
# server-only worker functions. Sends nothing real: classi-staging has no push subscriptions and no VAPID keys, SMS is
# blocked for NEXT_PUBLIC_DEPLOY_ENV=staging, and no email service is configured there. Side effect on test data only:
# waiting test notifications get pushed_at set (as any wake-up does).
# Needs in Environment "staging" (never in code or chat):
#   secret STAGING_DISPATCH_SECRET   the value of app_secrets.dispatch_secret in classi-staging (owner copies it there)
#   secret VERCEL_AUTOMATION_BYPASS_SECRET (already there)
# Prints only HTTP status codes and the route's counters, never a secret or a response header.
name: Staging wake-up (D-08)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: wake classi-staging once'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  wake:
    if: inputs.confirm == 'wake classi-staging once'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      BASE_URL: ${{ vars.STAGING_URL }}
    steps:
      - name: Target is classi-staging, secrets present, no database credential in reach
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WAKE: ${{ secrets.STAGING_DISPATCH_SECRET }}
          LEFTOVER_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          [ "${BASE_URL%/}" = "https://classi-staging.vercel.app" ] || { echo "::error::STAGING_URL must be exactly https://classi-staging.vercel.app"; exit 1; }
          [ -n "$BYPASS" ] || { echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET missing"; exit 1; }
          [ -n "$WAKE" ] || { echo "::error::STAGING_DISPATCH_SECRET missing in Environment staging"; exit 1; }
          [ -z "$LEFTOVER_DB_URL" ] || { echo "::error::a database link is visible to this job"; exit 1; }
          echo "target: $BASE_URL"
      - name: Before - the deployed code has the server key (health check "worker")
        env: { BYPASS: "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" }
        run: |
          curl -sS -o /tmp/h.json -w '%{http_code}\n' -H "x-vercel-protection-bypass: $BYPASS" "${BASE_URL%/}/api/health" > /tmp/h.code
          echo "health HTTP $(cat /tmp/h.code)"
          node -e 'const h=require("/tmp/h.json");const w=(h.checks||[]).find(c=>c.name==="worker");console.log("worker:",w?w.status:"absent");process.exit(w&&w.status==="ok"?0:1)'
      - name: Wrong secret is refused (401)
        env: { BYPASS: "${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}" }
        run: |
          c=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "x-vercel-protection-bypass: $BYPASS" -H 'content-type: application/json' \
            --data '{"secret":"not-the-secret"}' "${BASE_URL%/}/api/push/dispatch")
          echo "wrong secret: HTTP $c"; [ "$c" = 401 ]
      - name: The one wake-up
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WAKE: ${{ secrets.STAGING_DISPATCH_SECRET }}
        run: |
          body=$(node -e 'process.stdout.write(JSON.stringify({secret:process.env.WAKE}))')
          c=$(curl -sS -o /tmp/w.json -w '%{http_code}' -X POST -H "x-vercel-protection-bypass: $BYPASS" -H 'content-type: application/json' \
            --data "$body" "${BASE_URL%/}/api/push/dispatch")
          unset body
          echo "wake-up: HTTP $c"
          # only the counters (items, pushed, removed, emailed, texted, failed, batches)
          node -e 'const r=require("/tmp/w.json");const k=["ok","items","pushed","removed","emailed","texted","failed","batches"];console.log(JSON.stringify(Object.fromEntries(k.map(x=>[x,r[x]]))));if(r.pushed||r.emailed||r.texted){console.log("::error::something was delivered");process.exit(1)}' || { rm -f /tmp/w.json; exit 1; }
          rm -f /tmp/w.json
          [ "$c" = 200 ]
          echo "Next (read-only, outside this job): app_secrets.d08_worker_seen_at is now recent; nothing was pushed, texted or emailed (counters above)."

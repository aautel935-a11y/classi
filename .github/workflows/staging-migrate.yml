# Applies NEW migrations to the already-prepared STAGING database (classi-staging), to test them before production.
# Migrations only: no seed, no demo or test data, no re-initialisation; running it again with nothing new changes
# nothing (scripts/staging/migrate.sh). Manual only (Actions -> Staging database migrations -> Run workflow, branch
# staging-migrate), and every run waits for the owner's approval in the GitHub Environment "staging-db".
# Needs, in Environment "staging-db" only while a migration is being applied (add it, run, then delete it and reset
# the staging database password):
#   secret STAGING_DB_URL   classi-staging -> Connect -> Session pooler (never the production project)
name: Staging database migrations

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: migrate classi-staging'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging-db   # owner approval; deployment branch staging-migrate only
    steps:
      - name: Confirmation and branch
        env: { CONFIRM: "${{ inputs.confirm }}" }
        run: |
          [ "$CONFIRM" = "migrate classi-staging" ] || { echo "::error::type exactly: migrate classi-staging"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/staging-migrate" ] || { echo "::error::run it from the staging-migrate branch"; exit 1; }
      - uses: actions/checkout@v4
      - name: Check 1 - the link is classi-staging (never production)
        env: { STAGING_DB_URL: "${{ secrets.STAGING_DB_URL }}" }
        run: |
          [ -n "$STAGING_DB_URL" ] || { echo "::error::secret STAGING_DB_URL is not set in Environment staging-db"; exit 1; }
          u="$(printf %s "$STAGING_DB_URL" | tr -d '[:space:]')"
          case "$u" in *rfxhqcagdsuhkjzwbawx*) echo "::error::STAGING_DB_URL is the production project"; exit 1;; esac
          case "$u" in *nfipmylyahhogykikuqo*) echo "target: classi-staging";; *) echo "::error::STAGING_DB_URL is not classi-staging (nfipmylyahhogykikuqo)"; exit 1;; esac
          rest="${u#postgresql://}"; rest="${rest#postgres://}"; cred="${rest%@*}"; pass="${cred#*:}"
          case "$pass" in *"["*|*"]"*|*YOUR-PASSWORD*) echo "::error::the password still has brackets or the YOUR-PASSWORD placeholder"; exit 1;; esac
      - name: TLS to the staging database
        env: { CA: "${{ vars.SUPABASE_CA_CERT }}" }
        run: |
          if [ -n "$CA" ]; then printf '%s\n' "$CA" > "$RUNNER_TEMP/supabase-ca.crt"
            { echo "PGSSLMODE=verify-full"; echo "PGSSLROOTCERT=$RUNNER_TEMP/supabase-ca.crt"; } >> "$GITHUB_ENV"; echo "TLS: verify-full"
          else echo "PGSSLMODE=require" >> "$GITHUB_ENV"; echo "::warning::TLS encrypted but not verified: add the SUPABASE_CA_CERT variable"; fi
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb   # v1.7.3
        with: { version: 2.120.0 }
      - name: Checks 2-4 and new migrations only (no seed, no data)
        env: { STAGING_DB_URL: "${{ secrets.STAGING_DB_URL }}" }
        run: |
          STAGING_DB_URL="$(printf %s "$STAGING_DB_URL" | tr -d '[:space:]')"
          sh scripts/staging/migrate.sh 2>&1 | tee /tmp/migrate.log
      - name: Report (annotations)
        if: always()
        run: sh .github/report.sh "staging-db" /tmp/migrate.log

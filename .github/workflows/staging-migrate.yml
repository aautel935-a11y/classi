# Prepares the STAGING database (classi-staging): every migration in order, synthetic seed, scheduled jobs, photo
# storage, server-to-server settings pointing at the staging app. Runs when the branch "staging-migrate" is pushed.
# Needs, in the GitHub Environment "staging" (Settings -> Environments -> staging; deployment branches limited to
# staging-test and staging-migrate, so no other branch, pull request or workflow can read them):
#   secret   STAGING_DB_URL     connection string of the classi-staging database (Session pooler), never production
#   variable STAGING_APP_URL    https://classi-staging....vercel.app
# The secret is given only to the steps that use it (not to the CLI installer).
name: Staging database

on:
  push:
    branches: [staging-migrate]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: staging-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      STAGING_APP_URL: ${{ vars.STAGING_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: The target is the staging project (never production)
        env: { STAGING_DB_URL: "${{ secrets.STAGING_DB_URL }}" }
        run: |
          [ -n "$STAGING_DB_URL" ] || { echo "::error::secret STAGING_DB_URL is not set"; exit 1; }
          case "$STAGING_DB_URL" in *rfxhqcagdsuhkjzwbawx*) echo "::error::STAGING_DB_URL is the production project"; exit 1;; esac
          case "$STAGING_DB_URL" in *nfipmylyahhogykikuqo*) echo "target: classi-staging";; *) echo "::error::STAGING_DB_URL is not classi-staging (nfipmylyahhogykikuqo)"; exit 1;; esac
          # Shape of the link, as yes/no only (nothing of the value is printed):
          u="$(printf %s "$STAGING_DB_URL" | tr -d '[:space:]')"
          rest="${u#postgresql://}"; rest="${rest#postgres://}"; cred="${rest%@*}"; hostpart="${rest##*@}"
          user="${cred%%:*}"; pass="${cred#*:}"
          yn() { if eval "$1"; then echo yes; else echo no; fi; }
          echo "::notice title=link shape::link had spaces or line breaks (removed): $(yn '[ "$u" != "$STAGING_DB_URL" ]')"
          echo "::notice title=link shape::user is postgres.nfipmylyahhogykikuqo: $(yn '[ "$user" = postgres.nfipmylyahhogykikuqo ]')"
          echo "::notice title=link shape::password still has [ or ] or YOUR-PASSWORD: $(yn 'case "$pass" in *"["*|*"]"*|*YOUR-PASSWORD*) true;; *) false;; esac')"
          echo "::notice title=link shape::password has @ / ? # % or : (must be letters and digits): $(yn 'case "$pass" in *[@/?#%:]*) true;; *) false;; esac')"
          echo "::notice title=link shape::password length at least 12: $(yn '[ ${#pass} -ge 12 ]')"
          case "$pass" in *"["*|*"]"*|*YOUR-PASSWORD*) echo "::error::the password in STAGING_DB_URL still has brackets or the YOUR-PASSWORD placeholder"; exit 1;; esac
          echo "::notice title=link shape::host is the Supabase pooler on port 5432: $(yn 'case "$hostpart" in *.pooler.supabase.com:5432/postgres*) true;; *) false;; esac')"
      - name: TLS to the staging database
        env: { CA: "${{ vars.SUPABASE_CA_CERT }}" }
        run: |
          # Supabase's CA certificate (public; Supabase -> classi-staging -> Database settings -> SSL -> Download) as the
          # repository variable SUPABASE_CA_CERT turns on full verification; without it the connection is encrypted only.
          if [ -n "$CA" ]; then printf '%s\n' "$CA" > "$RUNNER_TEMP/supabase-ca.crt"
            { echo "PGSSLMODE=verify-full"; echo "PGSSLROOTCERT=$RUNNER_TEMP/supabase-ca.crt"; } >> "$GITHUB_ENV"; echo "TLS: verify-full"
          else echo "PGSSLMODE=require" >> "$GITHUB_ENV"; echo "::warning::TLS encrypted but not verified: add the SUPABASE_CA_CERT variable"; fi
      - name: Connection and identity check (must be classi-staging)
        env: { STAGING_DB_URL: "${{ secrets.STAGING_DB_URL }}" }
        run: |
          STAGING_DB_URL="$(printf %s "$STAGING_DB_URL" | tr -d '[:space:]')"
          # The cluster id of classi-staging (read through the Supabase connector; not a secret). Any other database stops here.
          want=7702070854497379551
          got="$(psql "$STAGING_DB_URL" -Atc "select system_identifier from pg_control_system()" 2>/tmp/conn.err)" || {
            echo "::error title=connection::$(sed -E 's#postgres(ql)?://[^ ]*#[link hidden]#g' /tmp/conn.err | head -1)"; exit 1; }
          [ "$got" = "$want" ] || { echo "::error title=identity::connected, but this is not the classi-staging database"; exit 1; }
          echo "::notice title=connection::connected over TLS ($(psql "$STAGING_DB_URL" -Atc "select case when ssl then 'encrypted' else 'NOT encrypted' end from pg_stat_ssl where pid = pg_backend_pid()")); identity: classi-staging; accounts before setup: $(psql "$STAGING_DB_URL" -Atc "select count(*) from auth.users")"
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb   # v1.7.3
        with: { version: 2.120.0 }
      - name: Migrations, seed, jobs, storage, settings
        env: { STAGING_DB_URL: "${{ secrets.STAGING_DB_URL }}" }
        run: |
          STAGING_DB_URL="$(printf %s "$STAGING_DB_URL" | tr -d '[:space:]')"
          STAGING_APP_URL="${STAGING_APP_URL:-https://classi-staging.vercel.app}" sh scripts/staging/setup.sh 2>&1 | tee /tmp/setup.log
      - name: Synthetic accounts and activity for manual testing
        env: { STAGING_DB_URL: "${{ secrets.STAGING_DB_URL }}" }
        run: |
          STAGING_DB_URL="$(printf %s "$STAGING_DB_URL" | tr -d '[:space:]')"
          psql "$STAGING_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/staging/staging_data.sql 2>&1 | tee /tmp/data.log
      - name: Report (annotations)
        if: always()
        run: sh .github/report.sh "staging-db" /tmp/setup.log /tmp/data.log

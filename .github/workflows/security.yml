# Free security scans (public repository): secrets in the whole history (Gitleaks), code patterns (Semgrep CE) and
# CodeQL. A confirmed finding fails the run; with branch protection on main (pending owner approval) it blocks the merge.
# No secrets are used by these jobs.
name: Security

on:
  push:
    branches: [main, "hardening/**", "v3/**"]
  pull_request:
  schedule:
    - cron: "23 2 * * 1"     # Monday 02:23 UTC: catches new rules and newly published issues
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks (whole history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with: { fetch-depth: 0 }
      - name: Gitleaks 8.21.2 (binary checked against the release checksum)
        run: |
          curl -sSL -o /tmp/gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gl.tgz" | sha256sum -c -
          tar -xzf /tmp/gl.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --exit-code 1 --report-format sarif --report-path /tmp/gitleaks.sarif
          echo "no secrets in $(git rev-list --count HEAD) commits (known false positives: .gitleaksignore)"

  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The official image, pinned: a pip install of semgrep 1.95.0 on the runner broke on a newer dependency
    # (opentelemetry import error), the image carries its own locked dependencies.
    container: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      # ERROR-severity findings fail the job. Every finding and every rule-loading error is printed as an annotation
      # (file, line, rule), so the result can be read without the job log.
      - name: Scan (TypeScript, React, Next.js, secrets, OWASP Top 10)
        run: |
          semgrep scan --metrics=off --config p/typescript --config p/react --config p/nextjs --config p/secrets --config p/owasp-top-ten \
            --exclude node_modules --exclude .next --exclude 'supabase/tests' --json --output /tmp/semgrep.json 2> /tmp/semgrep.err || true
          python3 .github/semgrep-report.py /tmp/semgrep.json /tmp/semgrep.err

  codeql:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9   # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9   # v3
        with:
          category: "/language:javascript-typescript"
          output: /tmp/codeql
      # The alert list is not readable with this repository's API access; print every result as an annotation so the
      # findings are visible in the run itself (informational: the job does not fail on them).
      - name: CodeQL results (annotations)
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json
          n = 0
          for f in glob.glob("/tmp/codeql/*.sarif"):
              for run in json.load(open(f)).get("runs", []):
                  rules = {r.get("id"): r for r in run.get("tool", {}).get("driver", {}).get("rules", [])}
                  for r in run.get("results", []):
                      n += 1
                      loc = (r.get("locations") or [{}])[0].get("physicalLocation", {})
                      path = loc.get("artifactLocation", {}).get("uri", "?"); line = loc.get("region", {}).get("startLine", 1)
                      sev = rules.get(r.get("ruleId"), {}).get("properties", {}).get("security-severity", "")
                      msg = " ".join(r.get("message", {}).get("text", "").split())[:250]
                      print(f"::warning file={path},line={line},title=CodeQL {r.get('ruleId')} {sev}::{msg}")
          print(f"CodeQL: {n} results")
          PY

  dependency-review:
    name: Dependency review (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48   # v4.9.0
        with:
          fail-on-severity: high
